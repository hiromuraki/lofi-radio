<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lo-Fi Radio</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <style>
        /* ── variables ─────────────────────────────────────────── */
        :root {
            --bg: #08080f;
            --glass-bg: rgba(18, 18, 36, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #e4e4ec;
            --text-dim: #8888a0;
            --accent: #f0a040;
            --accent-glow: rgba(240, 160, 64, 0.25);
            --crt-speed: 0.6s;
        }

        /* ── reset ──────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            user-select: none;
        }

        /* ── glass utility ──────────────────────────────────────── */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
        }

        /* ── ambient mixer toggle button ─────────────────────────── */
        .ambient-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 64px;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(240,160,64,0.15);
            border: 1px solid rgba(240,160,64,0.30);
            border-left: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            writing-mode: vertical-rl;
            letter-spacing: 3px;
            transition: left 0.35s ease, color 0.2s, background 0.2s;
        }
        .ambient-toggle:hover {
            background: rgba(240,160,64,0.25);
            box-shadow: 0 0 16px rgba(240,160,64,0.20);
        }
        .ambient-toggle.open {
            left: 33vw;
        }

        /* ── ambient mixer flyout panel ─────────────────────────── */
        .ambient-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 33vw;
            min-width: 280px;
            z-index: 99;
            border-radius: 0;
            transform: translateX(-100%);
            transition: transform 0.35s ease;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
        }
        .ambient-panel.open {
            transform: translateX(0);
        }
        .ambient-panel .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text);
        }
        .ambient-panel .mixer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .ambient-panel .mixer-label {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .ambient-panel .mixer-slider {
            flex: 1;
            width: auto;
        }
        .ambient-panel .mixer-val {
            font-size: 11px;
            color: var(--text-dim);
            width: 32px;
            text-align: right;
        }
        .ambient-panel .panel-hint {
            margin-top: auto;
            font-size: 11px;
            color: var(--text-dim);
            opacity: 0.4;
            text-align: center;
        }

        /* ── CRT bezel: fills viewport ───────────────────────────── */
        .crt-bezel {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            background: #050505;
        }

        /* ── CRT content: beam-collapse animation target ──────────── */
        .crt-content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #0c0c18;   /* essential: brightness() filter needs pixels to amplify */
            /* initial state: fully collapsed (matches old screen-animator) */
            opacity: 0;
            transform: scale(0, 0);
        }
        body.power-on .crt-content {
            animation: crt-on var(--crt-speed) ease-out forwards;
        }
        body.power-off .crt-content {
            animation: crt-off var(--crt-speed) ease-in forwards;
        }

        @keyframes crt-on {
            0%   { transform: scale(0, 0.005); opacity: 1; filter: brightness(30); }
            50%   { transform: scale(1, 0.005); filter: brightness(10); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }
        @keyframes crt-off {
            0%   { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            50%   { transform: scale(1, 0.005); filter: brightness(10); opacity: 1; }
            99%   { transform: scale(0, 0.005); filter: brightness(50); opacity: 1; }
            100% { transform: scale(0, 0); opacity: 0; }
        }

        /* ── full-bleed dynamic background ─────────────────────────── */
        .art-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        /* ── dark glass overlay ────────────────────────────────────── */
        .bg-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(8, 8, 15, 0.55);
            backdrop-filter: blur(20px) saturate(0.8);
            -webkit-backdrop-filter: blur(20px) saturate(0.8);
        }
        .art-fg {
            position: relative;
            z-index: 1;
            max-width: 80%;
            max-height: 75%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* ── 3-column layout ────────────────────────────────────────── */
        .layout-3col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
        }
        .col-left {
            width: 260px;
            flex-shrink: 0;
        }
        .col-center {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .col-right {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        /* scanlines */
        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: repeating-linear-gradient(
                rgba(0,0,0,0) 0px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
        }

        /* static noise */
        .static-noise {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            background: repeating-radial-gradient(#111 0 0.0001%, #222 0 0.0002%) 50% 50% / 2500px 2500px;
            opacity: 0;
            transition: opacity 0.15s;
            mix-blend-mode: overlay;
        }
        .static-noise.active {
            opacity: 0.7;
            animation: noise-shift 0.2s infinite;
        }
        @keyframes noise-shift {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }

        /* ── top bar ────────────────────────────────────────────── */
        .top-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 8px 24px;
        }
        .top-bar .clock {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text);
        }
        .top-bar .signal {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .signal-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            background: #666;
            transition: background 0.3s;
        }
        .signal-dot.locked { background: #4f8; box-shadow: 0 0 6px rgba(68,255,136,0.6); }
        .signal-dot.searching { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); animation: pulse 0.6s infinite; }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

/* ── controls tray (floating at bottom) ─────────────────── */
        .controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            padding: 12px 20px;
        }
        .ctl-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 80px;
        }
        .ctl-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
        }
        .freq-display {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 1px;
            min-width: 70px;
            text-align: center;
        }
        .freq-display .unit {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-dim);
        }

        /* ── sliders ────────────────────────────────────────────── */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg);
            box-shadow: 0 0 12px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 18px var(--accent-glow);
        }
        input[type="range"]:focus-visible {
            outline: 2px solid rgba(240, 160, 64, 0.4);
            outline-offset: 4px;
            border-radius: 2px;
        }

        /* Firefox / Gecko */
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg);
            box-shadow: 0 0 12px var(--accent-glow);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb:active {
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-thumb:hover {
            box-shadow: 0 0 18px var(--accent-glow);
        }
        input[type="range"]::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: transparent;
            border: none;
        }

        /* ── tuner: radio-dial treatment ────────────────────────── */
        #tunerSlider {
            width: 280px;
            height: 6px;
            border-radius: 3px;
            position: relative;
            z-index: 1;
        }
        #tunerSlider::-webkit-slider-thumb {
            width: 24px;
            height: 14px;
            border-radius: 7px;
            background: var(--accent);
            border: 2px solid var(--bg);
            box-shadow: 0 0 16px var(--accent-glow);
            cursor: ew-resize;
        }
        #tunerSlider::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }
        #tunerSlider::-moz-range-thumb {
            width: 24px;
            height: 14px;
            border-radius: 7px;
            background: var(--accent);
            border: 2px solid var(--bg);
            box-shadow: 0 0 16px var(--accent-glow);
            cursor: ew-resize;
        }
        #tunerSlider::-moz-range-thumb:active {
            transform: scale(1.15);
        }
        #tunerSlider::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: transparent;
            border: none;
        }
        /* Tuner tick marks */
        .ctl-group-tuner {
            position: relative;
        }
        .ctl-group-tuner::before {
            content: '';
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 6px;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(
                to right,
                transparent 0px,
                transparent calc(280px / 20 - 1px),
                rgba(255,255,255,0.07) calc(280px / 20 - 1px),
                rgba(255,255,255,0.07) calc(280px / 20)
            );
            border-radius: 3px;
        }

        /* ── volume popup ────────────────────────────────────────── */
        .ctl-group-vol {
            position: relative;
        }
        .vol-popup {
            position: absolute;
            bottom: 56px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transition-delay: 0.15s;
            padding: 12px 16px;
        }
        .ctl-group-vol:hover .vol-popup,
        .vol-popup.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
            transition-delay: 0s;
        }
        .vol-popup input[type="range"] {
            width: 120px;
        }
        .vol-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 18px;
            color: var(--text-dim);
        }
        .vol-btn:hover {
            border-color: rgba(255,255,255,0.2);
            color: var(--text);
        }

        /* ── power button ───────────────────────────────────────── */
        .power-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 18px;
            color: var(--text-dim);
        }
        .power-btn:hover {
            border-color: rgba(255,255,255,0.2);
            color: var(--text);
        }
        body.power-on .power-btn {
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            border-color: rgba(240,160,64,0.3);
        }

        /* ── power-off overlay ──────────────────────────────────── */
        .power-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        body:not(.power-on) .power-hint {
            opacity: 1;
        }
        .power-hint span {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--text-dim);
        }

        /* ── fullscreen button ──────────────────────────────────── */
        .fs-btn {
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dim);
            transition: color 0.2s;
        }
        .fs-btn:hover { color: var(--text); }

        /* ── chat panel (embedded in right column) ────────────────── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 68px 12px 100px;
            background: none;
            border: none;
            border-radius: 0;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            pointer-events: none;   /* clicks pass through panel, only children capture */
        }
        .chat-panel > * {
            pointer-events: auto;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            line-height: 1.45;
            /* thin scrollbar */
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .chat-msg {
            padding: 7px 12px;
            max-width: 92%;
            word-break: break-word;
        }
        .chat-msg.other {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            border-left: 2px solid rgba(240,160,64,0.22);
            border-radius: 3px 12px 12px 12px;
        }
        .chat-msg.self {
            align-self: flex-end;
            background: rgba(240,160,64,0.10);
            border-right: 2px solid rgba(240,160,64,0.40);
            border-radius: 12px 3px 12px 12px;
            text-align: right;
        }
        .chat-meta {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 2px;
            display: flex;
            gap: 8px;
        }
        .chat-body {
            color: var(--text);
            word-break: break-word;
        }
        .chat-empty {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            margin-top: 40px;
            opacity: 0.5;
        }
        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 2px;
            /* no border — seamless */
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.10);
            border-radius: 0;
            padding: 6px 2px;
            font-size: 13px;
            color: var(--text);
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s;
        }
        .chat-input:focus {
            border-bottom-color: var(--accent);
        }
        .chat-input::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }
        .chat-send-btn {
            width: 30px; height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }
        .chat-send-btn:hover {
            color: var(--accent);
        }

        /* ── hidden audio elements ──────────────────────────────── */
        audio { display: none; }
    </style>
</head>
<body>

    <!-- ── CRT screen (full viewport) ──────────────────────────── -->
    <div class="crt-bezel" id="crtBezel">
        <div class="crt-content" id="crtContent">
            <!-- Full-bleed dynamic background -->
            <div class="art-bg" id="artBg"></div>
            <!-- Dark glass overlay -->
            <div class="bg-overlay"></div>
            <!-- 3-column logical layout (transparent, visually integrated) -->
            <div class="layout-3col">
                <div class="col-left"></div>
                <div class="col-center">
                    <img class="art-fg" id="artFg" src="" alt="" />
                </div>
                <div class="col-right">
                    <div class="chat-panel" id="chatPanel">
                        <div class="chat-messages" id="chatMessages">
                            <div class="chat-empty">No messages yet</div>
                        </div>
                        <div class="chat-input-row">
                            <input type="text" class="chat-input" id="chatInput"
                                   maxlength="256" placeholder="Type a message..." />
                            <button class="chat-send-btn" id="chatSendBtn" title="Send">→</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- CRT effects (above content) -->
            <div class="scanlines"></div>
            <div class="static-noise" id="staticNoise"></div>
        </div>
    </div>

    <!-- ── power-off hint ──────────────────────────────────────── -->
    <div class="power-hint" id="powerHint"><span>PRESS ⏻ TO START</span></div>

    <!-- ── top bar ─────────────────────────────────────────────── -->
    <div class="top-bar glass" id="topBar">
        <span class="clock" id="clockDisplay">00:00</span>
        <span class="signal">
            <span class="signal-dot" id="signalDot"></span>
            <span id="signalText">NO SIGNAL</span>
        </span>
    </div>

    <!-- ── song info ───────────────────────────────────────────── -->
<!-- ── controls (floating) ─────────────────────────────────── -->
    <div class="controls glass" id="controlsBar">
        <!-- power -->
        <div class="ctl-group">
            <div class="power-btn glass" id="powerBtn" title="Power">⏻</div>
            <div class="ctl-label">Power</div>
        </div>

        <!-- tuner -->
        <div class="ctl-group ctl-group-tuner">
            <div class="freq-display"><span id="freqValue">--.-</span><span class="unit">MHz</span></div>
            <input type="range" min="875" max="1080" value="885" id="tunerSlider" />
            <div class="ctl-label">Tune</div>
        </div>

        <!-- volume -->
        <div class="ctl-group ctl-group-vol">
            <div class="vol-btn glass" id="volBtn" title="Volume">🔊</div>
            <div class="vol-popup glass" id="volPopup">
                <input type="range" min="0" max="100" value="65" id="volumeSlider" />
            </div>
            <div class="ctl-label">Volume</div>
        </div>

        <!-- fullscreen -->
        <div class="ctl-group">
            <div class="fs-btn glass" id="fsBtn" title="Fullscreen">⛶</div>
            <div class="ctl-label">Full</div>
        </div>
    </div>

    <!-- ── ambient mixer toggle + flyout ───────────────────────── -->
    <div class="ambient-toggle" id="ambientToggle" title="Ambience Mixer">MIX</div>

    <div class="ambient-panel glass" id="ambientPanel">
        <div class="panel-title">Ambience Mixer</div>

        <div class="mixer-row">
            <span class="mixer-label">Rain</span>
            <input type="range" min="0" max="100" value="30" class="mixer-slider" disabled />
            <span class="mixer-val">30%</span>
        </div>
        <div class="mixer-row">
            <span class="mixer-label">Fireplace</span>
            <input type="range" min="0" max="100" value="0" class="mixer-slider" disabled />
            <span class="mixer-val">0%</span>
        </div>
        <div class="mixer-row">
            <span class="mixer-label">Coffee Shop</span>
            <input type="range" min="0" max="100" value="60" class="mixer-slider" disabled />
            <span class="mixer-val">60%</span>
        </div>
        <div class="mixer-row">
            <span class="mixer-label">Vinyl Crackle</span>
            <input type="range" min="0" max="100" value="45" class="mixer-slider" disabled />
            <span class="mixer-val">45%</span>
        </div>
        <div class="mixer-row">
            <span class="mixer-label">Ocean Waves</span>
            <input type="range" min="0" max="100" value="0" class="mixer-slider" disabled />
            <span class="mixer-val">0%</span>
        </div>

        <div class="panel-hint">— API coming soon —</div>
    </div>


    <!-- ── audio pool ──────────────────────────────────────────── -->
    <audio id="audioA" preload="auto"></audio>
    <audio id="audioB" preload="auto"></audio>

    <script>
    /* ═══════════════════════════════════════════════════════════════
       Lo-Fi Radio – flat design + glassmorphism + CRT beam collapse
       ═══════════════════════════════════════════════════════════════ */

    // ── DOM refs ───────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const body = document.body;
    const artBg      = $("artBg");
    const artFg      = $("artFg");
    const staticN    = $("staticNoise");
    const clockDisp  = $("clockDisplay");
    const signalDot  = $("signalDot");
    const signalText = $("signalText");
    const freqValue  = $("freqValue");
    const tunerSlider = $("tunerSlider");
    const volumeSlider = $("volumeSlider");
    const volBtn       = $("volBtn");
    const volPopup     = $("volPopup");
    const powerBtn   = $("powerBtn");
    const fsBtn      = $("fsBtn");
    const audioA     = $("audioA");
    const audioB     = $("audioB");
    const powerHint  = $("powerHint");
    // chat
    const chatPanel   = $("chatPanel");
    const chatMessages = $("chatMessages");
    const chatInput   = $("chatInput");
    const chatSendBtn = $("chatSendBtn");

    // ── state ─────────────────────────────────────────────────────
    let poweredOn     = false;
    let musicList     = [];        // [{sha256, title}, ...]
    let imageList     = [];        // [{sha256}, ...]
    let playlist      = [];        // current shuffled order (indices into musicList)
    let playlistIdx   = 0;
    let activeAudio   = audioA;    // currently playing
    let standbyAudio  = audioB;    // for pre-fetch
    let prefetchDone  = false;
    let tuneTimer     = null;
    // chat
    let chatSse       = null;
    let chatMsgList   = [];    // max 20 items displayed
    let myIp          = null;  // own IP from /chat/whoami

    // ── seeded PRNG (mulberry32) ──────────────────────────────────
    function mulberry32(seed) {
        return function() {
            seed |= 0;
            seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    function seededShuffle(arr, seed) {
        const rng = mulberry32(seed);
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ── clock ─────────────────────────────────────────────────────
    function tick() {
        const n = new Date();
        clockDisp.textContent =
            String(n.getHours()).padStart(2, "0") + ":" +
            String(n.getMinutes()).padStart(2, "0");
    }
    setInterval(tick, 1000);
    tick();

    // ── helpers ───────────────────────────────────────────────────
    function setSignal(state) {
        signalDot.className = "signal-dot " + state;
        if (state === "locked")      signalText.textContent = "STEREO LOCKED";
        else if (state === "searching") signalText.textContent = "TUNING...";
        else                         signalText.textContent = "NO SIGNAL";
    }

    function showArt() {
        if (imageList.length === 0) return;
        const img = imageList[Math.floor(Math.random() * imageList.length)];
        const url = "/image/" + img.sha256;
        artFg.src = url;
        artBg.style.backgroundImage = `url(${url})`;
    }

    // ── slider fill (signal-strength gradient) ─────────────
    function updateSliderFill(slider) {
        const min = parseFloat(slider.min) || 0;
        const max = parseFloat(slider.max) || 100;
        const pct = ((slider.value - min) / (max - min)) * 100;
        slider.style.background =
            `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, rgba(255,255,255,0.08) ${pct}%)`;
    }


    function volume() {
        const v = parseInt(volumeSlider.value) / 100;
        audioA.volume = v;
        audioB.volume = v;
        // update icon
        const pct = parseInt(volumeSlider.value);
        if (pct >= 50)      volBtn.textContent = "🔊";
        else if (pct >= 20) volBtn.textContent = "🔉";
        else if (pct > 0)   volBtn.textContent = "🔈";
        else                volBtn.textContent = "🔇";
    }

    // ── playlist management ───────────────────────────────────────
    function buildPlaylist(seed) {
        if (musicList.length === 0) return;
        playlist = seededShuffle(
            musicList.map((_, i) => i),  // array of indices
            seed
        );
        playlistIdx = 0;
        prefetchDone = false;
    }

    function currentTrack() {
        if (playlist.length === 0) return null;
        return musicList[playlist[playlistIdx]];
    }

    function nextTrack() {
        if (playlist.length === 0) return null;
        playlistIdx = (playlistIdx + 1) % playlist.length;
        return currentTrack();
    }

    // ── audio engine ──────────────────────────────────────────────
    function loadAndPlay(track) {
        if (!track) return;
        // stop both
        audioA.pause(); audioA.src = "";
        audioB.pause(); audioB.src = "";
        // play on active
        activeAudio = audioA;
        standbyAudio = audioB;
        activeAudio.src = "/music/" + track.sha256;
        activeAudio.load();
        activeAudio.play().catch(() => {});
        prefetchDone = false;
        showArt();
        setSignal("locked");
        staticN.classList.remove("active");
    }

    function prefetchNext() {
        if (prefetchDone) return;
        const next = nextTrack();
        if (!next) return;
        // Advance playlistIdx back since nextTrack() already moved it
        playlistIdx = (playlistIdx - 1 + playlist.length) % playlist.length;

        const realNext = musicList[playlist[(playlistIdx + 1) % playlist.length]];
        standbyAudio.src = "/music/" + realNext.sha256;
        standbyAudio.load();
        prefetchDone = true;
    }

    function advanceTrack() {
        const track = nextTrack();
        if (!track) return;
        // swap active/standby
        if (prefetchDone && standbyAudio.src) {
            // Use the pre-fetched audio
            activeAudio.pause();
            activeAudio.src = "";
            [activeAudio, standbyAudio] = [standbyAudio, activeAudio];
            activeAudio.play().catch(() => {});
        } else {
            loadAndPlay(track);
            return;
        }
        prefetchDone = false;
        showArt();
    }

    // time-update handler: pre-fetch next 10 s before end
    function onTimeUpdate() {
        if (!poweredOn || prefetchDone) return;
        if (activeAudio.duration && activeAudio.duration - activeAudio.currentTime <= 10) {
            prefetchNext();
        }
    }

    function onEnded() {
        if (!poweredOn) return;
        advanceTrack();
    }

    audioA.addEventListener("timeupdate", onTimeUpdate);
    audioB.addEventListener("timeupdate", onTimeUpdate);
    audioA.addEventListener("ended", onEnded);
    audioB.addEventListener("ended", onEnded);

    // ── chat ──────────────────────────────────────────────────────
    function renderChat() {
        if (chatMsgList.length === 0) {
            chatMessages.innerHTML = '<div class="chat-empty">No messages yet</div>';
            return;
        }
        chatMessages.innerHTML = chatMsgList.map(m => {
            const t = new Date(m.timestamp);
            const timeStr = String(t.getHours()).padStart(2, "0") + ":" +
                            String(t.getMinutes()).padStart(2, "0");
            const side = (myIp && m.sender_ip === myIp) ? "self" : "other";
            return `<div class="chat-msg ${side}">
                <div class="chat-meta">
                    <span class="chat-ip">${m.sender_ip}</span>
                    <span class="chat-time">${timeStr}</span>
                </div>
                <div class="chat-body">${m.content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
            </div>`;
        }).join("");
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function connectChat() {
        // Fetch own IP first so bubbles render correctly from the start
        try {
            const r = await fetch("/chat/whoami");
            const d = await r.json();
            myIp = d.ip;
        } catch (_) { myIp = null; }

        if (chatSse) chatSse.close();
        chatSse = new EventSource("/chat/stream");
        chatSse.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                chatMsgList.push(msg);
                if (chatMsgList.length > 20) chatMsgList = chatMsgList.slice(-20);
                renderChat();
            } catch (_) { /* ignore malformed */ }
        };
        chatSse.onerror = () => {
            chatSse.close();
            // Reconnect after 3 seconds
            setTimeout(() => { if (poweredOn) connectChat(); }, 3000);
        };
    }

    function disconnectChat() {
        if (chatSse) { chatSse.close(); chatSse = null; }
        chatMsgList = [];
        myIp = null;
        chatMessages.innerHTML = '<div class="chat-empty">No messages yet</div>';
    }

    async function sendChat() {
        const content = chatInput.value.trim();
        if (!content) return;
        chatInput.value = "";
        try {
            await fetch("/chat/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content }),
            });
        } catch (e) {
            console.error("Chat send failed", e);
        }
    }

    chatSendBtn.addEventListener("click", sendChat);
    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); sendChat(); }
    });

    // ── ambient mixer panel toggle ───────────────────────────────
    const ambientToggle = $("ambientToggle");
    const ambientPanel  = $("ambientPanel");
    let ambientOpen = false;

    ambientToggle.addEventListener("click", () => {
        ambientOpen = !ambientOpen;
        if (ambientOpen) {
            ambientToggle.classList.add("open");
            ambientPanel.classList.add("open");
        } else {
            ambientToggle.classList.remove("open");
            ambientPanel.classList.remove("open");
        }
    });

    // ── tuning ────────────────────────────────────────────────────
    function doTune() {
        if (!poweredOn || musicList.length === 0) return;
        const seed = parseInt(tunerSlider.value);  // 875–1080, direct seed
        buildPlaylist(seed);
        const track = currentTrack();
        if (track) loadAndPlay(track);
    }

    tunerSlider.addEventListener("input", () => {
        if (!poweredOn) return;
        const v = parseInt(tunerSlider.value);
        freqValue.textContent = (v / 10).toFixed(1);
        updateSliderFill(tunerSlider);

        // pause immediately
        audioA.pause();
        audioB.pause();
        standbyAudio.src = "";
        prefetchDone = false;

        // show tuning effect
        staticN.classList.add("active");
        setSignal("searching");

        // debounce
        clearTimeout(tuneTimer);
        tuneTimer = setTimeout(doTune, 600);
    });

    // ── power ─────────────────────────────────────────────────────
    async function powerOn() {
        poweredOn = true;
        body.className = "power-on";
        powerHint.style.display = "none";  // hide instantly, no transition
        connectChat();

        // fetch data from backend
        try {
            const [ml, il] = await Promise.all([
                fetch("/musiclist").then(r => r.json()),
                fetch("/imagelist").then(r => r.json()),
            ]);
            musicList = ml;
            imageList = il;
        } catch (e) {
            console.error("Failed to fetch media indexes", e);
            musicList = [];
            imageList = [];
        }

        if (musicList.length === 0) {
            setSignal("");
            signalText.textContent = "NO MUSIC FOUND";
            return;
        }

        // initial tune
        const seed = parseInt(tunerSlider.value);
        freqValue.textContent = (seed / 10).toFixed(1);
        buildPlaylist(seed);
        const track = currentTrack();
        if (track) {
            // wait for CRT animation before playing
            const delay = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--crt-speed")) * 1000 + 300;
            setTimeout(() => loadAndPlay(track), delay);
        }
    }

    function powerOff() {
        poweredOn = false;
        body.className = "power-off";
        disconnectChat();
        audioA.pause(); audioA.src = "";
        audioB.pause(); audioB.src = "";
        staticN.classList.remove("active");
        prefetchDone = false;
        setSignal("");
        clearTimeout(tuneTimer);

        // clear art & show power hint after collapse animation
        const delay = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--crt-speed")) * 1000 + 200;
        setTimeout(() => {
            artFg.src = "";
            artBg.style.backgroundImage = "";
            powerHint.style.display = "";  // show hint once screen is fully dark
        }, delay);
    }

    powerBtn.addEventListener("click", () => {
        if (poweredOn) powerOff();
        else powerOn();
    });

    // ── volume slider + popup ────────────────────────────────────
    volumeSlider.addEventListener("input", () => {
        updateSliderFill(volumeSlider);
        volume();
    });
    volume(); // init icon
    updateSliderFill(volumeSlider);

    volBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        volPopup.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
        if (!volPopup.contains(e.target) && e.target !== volBtn) {
            volPopup.classList.remove("open");
        }
    });

    // ── initial slider fills ────────────────────────────────────
    updateSliderFill(tunerSlider);
    document.querySelectorAll('.mixer-slider').forEach(s => {
        updateSliderFill(s);
        s.addEventListener('input', () => updateSliderFill(s));
    });

    // ── fullscreen ────────────────────────────────────────────────
    fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    });

    // ── keyboard shortcuts ────────────────────────────────────────
    document.addEventListener("keydown", e => {
        if (e.key === " " || e.code === "Space") {
            e.preventDefault();
            powerBtn.click();
        }
        if (e.key === "f" && !e.ctrlKey && !e.metaKey) {
            fsBtn.click();
        }
    });
    </script>
</body>
</html>
